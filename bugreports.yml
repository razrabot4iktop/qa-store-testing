---
- summary: Описание товара остаётся на английском при переключении языка интерфейса
  environment: Браузер на компьютере, сайт https://products-store.hexlet.app/
  steps-to-reproduce:
    - Открыть карточку товара.
    - Переключить язык интерфейса на русский или испанский.
    - Проверить описание товара.
  expected-result: Описание товара отображается на выбранном языке.
  actual-result: Элементы интерфейса переводятся, но описание товара остаётся на английском.
- summary: Появляется подтверждение оформления заказа без ввода данных
  environment: Браузер на компьютере, сайт https://products-store.hexlet.app/
  steps-to-reproduce:
    - Добавить товар в корзину.
    - Открыть корзину.
    - Нажать кнопку оформления заказа.
    - Не вводить персональные или платёжные данные.
  expected-result: Открывается следующий этап оформления заказа или система запрашивает необходимые данные до подтверждения заказа.
  actual-result: Появляется модальное окно с сообщением, что заказ оформлен, хотя данные пользователя не заполнялись.
