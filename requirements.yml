---
functional:
  - Пользователь может просматривать каталог товаров.
  - Пользователь может искать товары по ключевому слову.
  - Пользователь может выбирать категорию товаров.
  - Пользователь может фильтровать товары.
  - Пользователь может просматривать подробную информацию о товаре.
  - В каталоге и карточке товара отображаются название, рейтинг, цена со скидкой и цена без скидки.
  - Пользователь может добавлять товары в корзину.
  - Пользователь может просматривать содержимое корзины.
  - Пользователь может удалять товары из корзины.
  - Пользователь может возвращаться из корзины в каталог и продолжать покупки.
  - Пользователь может оформить заказ и перейти к оплате.
  - Пользователь может переключать язык интерфейса между русским, английским и испанским.
non-functional:
  - Интерфейс адаптируется к мобильным устройствам.
  - Приложение работает как SPA без полной перезагрузки страницы при обычной навигации.
  - Сайт удобен в использовании и оптимизирован по скорости работы.
  - Сайт защищает данные пользователя.
  - Сайт совместим с актуальными версиями популярных браузеров.
  - Сайт способен обрабатывать большое количество трафика.
  - Сайт доступен на различных устройствах.
  - Сайт доступен напрямую из интернета без VPN.
implicit:
  - Количество товаров в корзине и итоговая сумма пересчитываются после добавления или удаления товара.
  - При пустой корзине отображается понятное сообщение и предложение перейти в каталог.
  - После обновления страницы содержимое корзины сохраняется в пределах сессии браузера.
  - Поиск без совпадений показывает понятное сообщение.
  - Фильтры можно сбросить, чтобы снова увидеть полный каталог.
  - Цена со скидкой не превышает исходную цену.
  - Ссылки, кнопки и элементы управления доступны для взаимодействия и имеют понятные названия.
  - При ошибке загрузки товаров пользователь видит понятное уведомление или состояние загрузки.
