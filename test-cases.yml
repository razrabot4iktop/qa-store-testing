---
- summary: Проверка отображения каталога товаров
  requirement: Пользователь может просматривать каталог товаров.
  prerequisites: Открыта главная страница магазина.
  test-data: Не требуется.
  steps:
    - Открыть главную страницу магазина.
    - Дождаться загрузки каталога.
  expected-result: Отображается список товаров с карточками и элементами управления.
- summary: Проверка поиска товара по существующему названию
  requirement: Пользователь может искать товары по ключевому слову.
  prerequisites: Открыта главная страница магазина.
  test-data: Название товара, который присутствует в каталоге.
  steps:
    - Ввести название существующего товара в поле поиска.
    - Запустить поиск, если это требуется интерфейсом.
  expected-result: В результатах отображаются товары, соответствующие запросу.
- summary: Проверка поиска по отсутствующему запросу
  requirement: Пользователь может искать товары по ключевому слову.
  prerequisites: Открыта главная страница магазина.
  test-data: qqq-no-product-123
  steps:
    - Ввести несуществующий запрос в поле поиска.
    - Запустить поиск, если это требуется интерфейсом.
  expected-result: Отображается пустой результат или понятное сообщение; интерфейс не ломается.
- summary: Проверка фильтрации товаров по категории
  requirement: Пользователь может выбирать категорию товаров.
  prerequisites: Открыта главная страница магазина.
  test-data: Любая категория, доступная в интерфейсе.
  steps:
    - Выбрать категорию товаров.
  expected-result: В каталоге остаются товары выбранной категории.
- summary: Проверка открытия карточки товара
  requirement: Пользователь может просматривать подробную информацию о товаре.
  prerequisites: Открыта главная страница магазина.
  test-data: Любой товар из каталога.
  steps:
    - Открыть карточку выбранного товара.
  expected-result: Отображается подробная информация о выбранном товаре.
- summary: Проверка отображения цены и рейтинга товара
  requirement: В каталоге и карточке товара отображаются название, рейтинг, цена со скидкой и цена без скидки.
  prerequisites: Открыта главная страница магазина.
  test-data: Товар, у которого указана скидка.
  steps:
    - Найти товар со скидкой в каталоге.
    - Проверить название, рейтинг, исходную цену и цену со скидкой.
    - Открыть карточку товара и проверить те же данные.
  expected-result: Название, рейтинг и обе цены отображаются корректно; цена со скидкой не выше исходной.
- summary: Проверка добавления товара в корзину
  requirement: Пользователь может добавлять товары в корзину.
  prerequisites: Открыта главная страница магазина.
  test-data: Любой доступный товар.
  steps:
    - Добавить товар в корзину.
    - Открыть корзину.
  expected-result: Выбранный товар отображается в корзине, количество и сумма рассчитаны корректно.
- summary: Проверка удаления товара из корзины
  requirement: Пользователь может удалять товары из корзины.
  prerequisites: В корзину добавлен хотя бы один товар.
  test-data: Товар, добавленный в корзину.
  steps:
    - Открыть корзину.
    - Удалить выбранный товар.
  expected-result: Удалённый товар отсутствует в корзине, итоговая сумма обновлена.
- summary: Проверка сохранения корзины после обновления страницы
  requirement: Корзина хранится в сессии браузера.
  prerequisites: В корзину добавлен хотя бы один товар.
  test-data: Любой доступный товар.
  steps:
    - Добавить товар в корзину.
    - Обновить страницу браузера.
    - Открыть корзину.
  expected-result: Содержимое корзины сохраняется в пределах сессии браузера.
- summary: Проверка переключения языка интерфейса
  requirement: Пользователь может переключать язык интерфейса между русским, английским и испанским.
  prerequisites: Открыта главная страница магазина.
  test-data: Русский, английский и испанский языки.
  steps:
    - Переключить язык интерфейса на английский и проверить подписи и описание товара.
    - Переключить язык интерфейса на русский и проверить подписи и описание товара.
    - Переключить язык интерфейса на испанский и проверить подписи и описание товара.
  expected-result: Подписи интерфейса и описание товара отображаются на выбранном языке.
- summary: Проверка отображения магазина на мобильном экране
  requirement: Интерфейс адаптируется к мобильным устройствам.
  prerequisites: Открыта главная страница магазина в DevTools с эмуляцией мобильного устройства.
  test-data: Ширина экрана 375 пикселей.
  steps:
    - Включить эмуляцию мобильного устройства в DevTools.
    - Обновить страницу.
    - Проверить каталог, фильтры, карточки и корзину.
  expected-result: Контент не обрезается по ширине, элементы управления доступны.
- summary: Проверка перехода к оформлению заказа
  requirement: Пользователь может оформить заказ с переходом на страницу оплаты.
  prerequisites: В корзину добавлен хотя бы один товар.
  test-data: Любой доступный товар.
  steps:
    - Открыть корзину.
    - Нажать кнопку оформления заказа.
  expected-result: Открывается предусмотренный приложением этап оформления заказа или перехода к оплате.
